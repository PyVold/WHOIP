{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Reset Password</h4>
                </div>
                <div class="card-body">
                    <p>Enter your new password below.</p>

                    <form method="POST" action="{{ url_for('access.reset_password', token=token) }}">
                        <div class="form-group">
                            <label for="password">New Password</label>
                            <input type="password" class="form-control" id="password" name="password" required
                                   placeholder="Enter new password" minlength="8">
                            <small class="form-text text-muted">
                                At least 8 characters with uppercase, lowercase, and digit
                            </small>
                        </div>

                        <div class="form-group mt-3">
                            <label for="password_confirm">Confirm Password</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required
                                   placeholder="Confirm new password" minlength="8">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block mt-3">Reset Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Client-side password match validation
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('password_confirm').value;

    if (password !== confirm) {
        e.preventDefault();
        alert('Passwords do not match!');
    }
});
</script>
{% endblock %}
